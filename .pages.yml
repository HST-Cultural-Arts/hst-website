media:
  - name: images
    label: Images
    input: public/assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
    extensions: [webp]
  - name: documents
    label: Documents
    input: public/assets/uploads/documents
    output: /assets/uploads/documents
    categories: [document]
    extensions: [pdf]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]
    extensions: [png, svg, ico, webp]

components:
  button:
    type: object
    label: Button
    fields:
      - name: title
        label: Text
        type: string
        required: true
      - name: href
        label: Link
        type: string
        required: true
      - name: type
        label: Style
        type: select
        default: primary
        options:
          values: [primary, secondary]

  card:
    type: object
    label: Program card
    fields:
      - name: heading
        label: Heading
        type: string
        required: true
      - name: image
        label: Image
        component: image
      - name: button
        label: Button
        component: button

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
        required: true
        description: >
          Please convert images to WebP before uploading to reduce file size.
          Use https://localconvert.com/convert/image/ to convert images
          privately in your browser.
      - name: alt
        label: Accessibility text
        type: string
        description: Describe the image for screen readers. Leave blank only for decorative images.
      - name: size
        label: Display size
        type: select
        default: medium
        description: Controls the image's maximum width while keeping it responsive.
        options:
          values: [small, medium, large, full]
      - name: crop
        label: Crop
        type: select
        default: natural
        description: Natural preserves the complete image. Other options crop it to a consistent frame.
        options:
          values: [natural, landscape, square, portrait]

  brand:
    type: object
    label: Brand
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
      - name: logoAlt
        label: Logo accessibility text
        type: string
        required: true
        description: Describe the logo for screen readers.

  text:
    type: object
    label: Text
    fields:
      - name: text
        label: Text
        type: rich-text
        required: true
        description: Add formatted text, headings, links, or lists.

  embed:
    type: object
    label: Embed
    fields:
      - name: provider
        label: Provider
        type: select
        required: true
        options:
          values: [calendar, youtube]
      - name: src
        label: Embed URL
        type: string
        required: true
        description: Use the provider's HTTPS embed URL, not the regular page URL.
      - name: title
        label: Accessibility title
        type: string
        required: true
        description: Briefly describe what the embedded content is.
      - name: size
        label: Display size
        type: select
        default: large
        options:
          values: [small, medium, large, full]
      - name: height
        label: Viewport height
        type: select
        description: Controls the embed's vertical space. Leave blank to use the default.
        options:
          values: [short, medium, tall]

  section:
    type: object
    label: Section
    fields:
      - name: color
        label: Section color
        type: select
        required: true
        default: light
        options:
          values: [dark, light, home-hero]
        description: The color of the section, dark or light.
      - name: heading
        label: Section heading
        type: string
        description: (Optional) The heading for the section. Useful for grid layouts where you want a main section heading.
      - name: layout
        label: Layout
        type: select
        default: auto
        description: Auto uses a flexible wrapping layout. Column options use an equal-width grid.
        options:
          values:
            - name: auto
              label: Automatic
            - name: 1col
              label: 1 column
            - name: 2cols
              label: 2 columns
            - name: 3cols
              label: 3 columns
            - name: 4cols
              label: 4 columns
            - name: 5cols
              label: 5 columns
      - name: blocks
        label: Content blocks (optional)
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            description: Display one image.
            fields:
              - name: image
                component: image
          - name: button
            label: Button block
            fields:
              - name: button
                component: button
          - name: card
            label: Card block
            description: Display a heading, image, and button together as a card.
            component: card
          - name: embed
            label: Embed block
            component: embed
          - name: gallery
            label: Gallery block
            description: Display multiple images as a slideshow gallery.
            fields:
              - name: gallery
                label: Gallery images (add one or more)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "Image {index}"
                fields:
                  - name: src
                    label: Image file
                    type: image
                    required: true
                  - name: alt
                    label: Accessibility text
                    type: string
                    description: Describe the image for screen readers. Leave blank only for decorative images.
          - name: timeline
            label: Timeline block
            description: Display dated entries with text, images, buttons, or embeds.
            fields:
              - name: years
                label: Timeline years (optional)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.year}"
                fields:
                  - name: year
                    label: Year
                    type: string
                    required: true
                    description: Enter a year or milestone label, such as "1995 (HST's Beginning)".
                  - name: blocks
                    label: Timeline entries (optional)
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "Entry {index}"
                    fields:
                      - name: block
                        label: Entry content
                        type: block
                        list:
                          collapsible:
                            collapsed: true
                            summary: "Content block {index}"
                        blockKey: type
                        blocks:
                          - name: text
                            label: Text block
                            component: text
                          - name: image
                            label: Image block
                            fields:
                              - name: image
                                component: image
                          - name: button
                            label: Button block
                            fields:
                              - name: button
                                component: button
                          - name: embed
                            label: Embed block
                            component: embed
content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    subfolders: true
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
        description: >
          Enter the complete filename above, generally based on the page's name.
          Use a root filename such as programs.md or timeline.md for a section
          landing page. The ".md" is the file extension for Markdown files.
      - name: sections
        label: Page sections
        component: section
        list:
          collapsible:
            collapsed: true
            summary: "{fields.color} section"

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        component: brand
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true

  - name: footer
    label: Footer
    type: file
    path: src/data/footer.json
    fields:
      - name: brand
        component: brand
      - name: tagline
        label: Tagline
        type: text
        required: true
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: columns
            label: Footer columns
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.heading}"
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: links
                label: Links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.label}"
                fields:
                  - name: label
                    label: Label
                    type: string
                    required: true
                  - name: href
                    label: Link
                    type: string
                    required: true

settings:
  content:
    merge: true
