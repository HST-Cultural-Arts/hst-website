media:
  - name: images
    label: Images
    input: public/assets/uploads/images
    output: /assets/uploads/images
    categories: [image]
    extensions: [webp]
  - name: documents
    label: Documents
    input: public/assets/uploads/documents
    output: /assets/uploads/documents
    categories: [document]
    extensions: [pdf]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]
    extensions: [png, svg, ico, webp]

components:
  button:
    type: object
    label: Button
    fields:
      - name: title
        label: Text
        type: string
        required: true
      - name: href
        label: Link
        type: string
        required: true
      - name: variant
        label: Style
        type: select
        default: primary
        options:
          values: [primary, secondary]

  gallery:
    type: object
    label: Gallery
    fields:
      - name: images
        label: Gallery images (add one or more)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Image {index}"
        fields:
          - name: src
            label: Image file
            type: image
            required: true
          - name: alt
            label: Accessibility text
            type: string
            description: Describe the image for screen readers. Leave blank only for decorative images.
      - name: size
        label: Gallery width
        type: select
        default: large
        options:
          values: [small, medium, large, full]
        description: Controls the gallery's maximum width.
      - name: crop
        label: Image crop
        type: select
        default: natural
        options:
          values: [natural, landscape, square, portrait]
        description: Natural shows each image without cropping.
      - name: controls
        label: Show arrow controls
        type: boolean
        default: true
      - name: indicators
        label: Show slide indicators
        type: boolean
        default: true
      - name: autoScroll
        label: Auto-scroll
        type: boolean
        default: false
      - name: autoScrollInterval
        label: Auto-scroll interval
        type: number
        default: 5000
        description: Time between slides in milliseconds.
      - name: pauseOnHover
        label: Pause on hover
        type: boolean
        default: true

  contentblock:
    type: object
    label: Content block
    fields:
      - name: color
        label: Block color
        type: select
        default: transparent
        options:
          values: [navy, cream, white, transparent]
        description: Choose a background color for this group of blocks.
      - name: variant
        label: Block style
        type: select
        default: default
        options:
          values: [default, card]
        description: Default is for layout only. Card adds padding, borders, shadow, and hover styling.
      - name: layout
        label: Layout
        type: select
        default: 1col
        description: Choose how the nested blocks are arranged.
        options:
          values:
            - name: auto
              label: Automatic
            - name: 1col
              label: 1 column
            - name: 2cols
              label: 2 columns
            - name: 3cols
              label: 3 columns
            - name: 4cols
              label: 4 columns
            - name: 5cols
              label: 5 columns
      - name: blocks
        label: Nested content blocks (optional)
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Nested block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            component: image
          - name: button
            label: Button block
            component: button
          - name: embed
            label: Embed block
            component: embed
          - name: gallery
            label: Gallery block
            component: gallery
          - name: block
            label: Nested block
            description: Add another group of content blocks.
            component: contentblock2

  contentblock2:
    type: object
    label: Content block 2
    fields:
      - name: color
        label: Block color
        type: select
        default: transparent
        options:
          values: [navy, cream, white, transparent]
        description: Choose a background color for this group of blocks.
      - name: variant
        label: Block style
        type: select
        default: default
        options:
          values: [default, card]
        description: Default is for layout only. Card adds padding, borders, shadow, and hover styling.
      - name: layout
        label: Layout
        type: select
        default: 1col
        description: Choose how the nested blocks are arranged.
        options:
          values:
            - name: auto
              label: Automatic
            - name: 1col
              label: 1 column
            - name: 2cols
              label: 2 columns
            - name: 3cols
              label: 3 columns
            - name: 4cols
              label: 4 columns
            - name: 5cols
              label: 5 columns
      - name: blocks
        label: Nested content blocks (optional)
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Nested block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            component: image
          - name: button
            label: Button block
            component: button
          - name: embed
            label: Embed block
            component: embed
          - name: gallery
            label: Gallery block
            component: gallery
          - name: block
            label: Nested block
            description: Add one final group of content blocks.
            component: contentblock3

  contentblock3:
    type: object
    label: Content block 3
    fields:
      - name: color
        label: Block color
        type: select
        default: transparent
        options:
          values: [navy, cream, white, transparent]
        description: Choose a background color for this group of blocks.
      - name: variant
        label: Block style
        type: select
        default: default
        options:
          values: [default, card]
        description: Default is for layout only. Card adds padding, borders, shadow, and hover styling.
      - name: layout
        label: Layout
        type: select
        default: 1col
        description: Choose how the nested blocks are arranged.
        options:
          values:
            - name: auto
              label: Automatic
            - name: 1col
              label: 1 column
            - name: 2cols
              label: 2 columns
            - name: 3cols
              label: 3 columns
            - name: 4cols
              label: 4 columns
            - name: 5cols
              label: 5 columns
      - name: blocks
        label: Nested content blocks (optional)
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Nested block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            component: image
          - name: button
            label: Button block
            component: button
          - name: embed
            label: Embed block
            component: embed
          - name: gallery
            label: Gallery block
            component: gallery

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
        required: true
        description: >
          Please convert images to WebP before uploading to reduce file size.
          Use https://localconvert.com/convert/image/ to convert images
          privately in your browser.
      - name: alt
        label: Accessibility text
        type: string
        description: Describe the image for screen readers. Leave blank only for decorative images.
      - name: size
        label: Display size
        type: select
        default: medium
        description: Controls the image's maximum width while keeping it responsive.
        options:
          values: [small, medium, large, full]
      - name: crop
        label: Crop
        type: select
        default: natural
        description: Natural preserves the complete image. Other options crop it to a consistent frame.
        options:
          values: [natural, landscape, square, portrait]

  brand:
    type: object
    label: Brand
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        required: true
      - name: logoAlt
        label: Logo accessibility text
        type: string
        required: true
        description: Describe the logo for screen readers.

  text:
    type: object
    label: Text
    fields:
      - name: text
        label: Text
        type: rich-text
        required: true
        description: Add formatted text, headings, links, or lists.

  embed:
    type: object
    label: Embed
    fields:
      - name: provider
        label: Provider
        type: select
        required: true
        options:
          values: [calendar, youtube]
      - name: src
        label: Embed URL
        type: string
        required: true
        description: Use the provider's HTTPS embed URL, not the regular page URL.
      - name: title
        label: Accessibility title
        type: string
        required: true
        description: Briefly describe what the embedded content is.
      - name: size
        label: Display size
        type: select
        default: large
        options:
          values: [small, medium, large, full]
      - name: height
        label: Viewport height
        type: select
        description: Controls the embed's vertical space. Leave blank to use the default.
        options:
          values: [short, medium, tall]

  timeline:
    type: object
    label: Timeline
    fields:
      - name: timeline
        label: Timeline years (optional)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.year}"
        fields:
          - name: year
            label: Year
            type: string
            required: true
            description: Enter a year or milestone label, such as "1995 (HST's Beginning)".
          - name: blocks
            label: Timeline entries (optional)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Entry {index}"
            fields:
              - name: type
                label: Entry type
                type: select
                required: true
                default: block
                options:
                  values: [block]
                description: Timeline entries use the block content layout.
              - name: color
                label: Block color
                type: select
                default: white
                options:
                  values: [navy, cream, white, transparent]
              - name: variant
                label: Block style
                type: select
                default: card
                options:
                  values: [default, card]
                description: Default is for layout only. Card adds padding, borders, shadow, and hover styling.
              - name: layout
                label: Layout
                type: select
                default: 1col
                description: Choose how the entry blocks are arranged.
                options:
                  values:
                    - name: auto
                      label: Automatic
                    - name: 1col
                      label: 1 column
                    - name: 2cols
                      label: 2 columns
                    - name: 3cols
                      label: 3 columns
                    - name: 4cols
                      label: 4 columns
                    - name: 5cols
                      label: 5 columns
              - name: blocks
                label: Entry content blocks (optional)
                type: block
                list:
                  collapsible:
                    collapsed: true
                    summary: "Content block {index}"
                blockKey: type
                blocks:
                  - name: text
                    label: Text block
                    component: text
                  - name: image
                    label: Image block
                    component: image
                  - name: button
                    label: Button block
                    component: button
                  - name: embed
                    label: Embed block
                    component: embed
                  - name: gallery
                    label: Gallery block
                    component: gallery

  section:
    type: object
    label: Section
    fields:
      - name: color
        label: Section color
        type: select
        required: true
        default: cream
        options:
          values: [navy, cream, white, halos]
        description: Choose the section background color.
      - name: layout
        label: Layout
        type: select
        default: auto
        description: Auto uses a flexible wrapping layout. Column options use an equal-width grid.
        options:
          values:
            - name: auto
              label: Automatic
            - name: 1col
              label: 1 column
            - name: 2cols
              label: 2 columns
            - name: 3cols
              label: 3 columns
            - name: 4cols
              label: 4 columns
            - name: 5cols
              label: 5 columns
      - name: blocks
        label: Content blocks
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "Block {index}"
        blockKey: type
        blocks:
          - name: text
            label: Text block
            component: text
          - name: image
            label: Image block
            description: Display one image.
            component: image
          - name: button
            label: Button block
            component: button
          - name: block
            label: Content block
            description: Group more text, images, galleries, buttons, or content blocks.
            component: contentblock
          - name: embed
            label: Embed block
            component: embed
          - name: gallery
            label: Gallery block
            description: Display multiple images as a slideshow gallery.
            component: gallery
          - name: timeline
            label: Timeline block
            description: Display dated entries with text, images, buttons, or embeds.
            component: timeline
content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    subfolders: true
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [title]
    fields:
      - name: title
        label: Page title
        type: string
        required: true
        description: The page title also determines the lowercase, dash-separated filename.
      - name: sections
        label: Page sections
        component: section
        list:
          collapsible:
            collapsed: true
            summary: "{fields.color} section"

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        component: brand
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: Link
                type: string
                required: true

  - name: footer
    label: Footer
    type: file
    path: src/data/footer.json
    fields:
      - name: brand
        component: brand
      - name: tagline
        label: Tagline
        type: text
        required: true
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: columns
            label: Footer columns
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.heading}"
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: links
                label: Links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.label}"
                fields:
                  - name: label
                    label: Label
                    type: string
                    required: true
                  - name: href
                    label: Link
                    type: string
                    required: true

settings:
  content:
    merge: true
