media:
  - name: uploads
    label: Page uploads
    input: public/assets/uploads
    output: /assets/uploads
    categories: [image]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]

components:
  button:
    type: object
    label: Button
    fields:
      - name: title
        label: Text
        type: string
      - name: href
        label: Link
        type: string
      - name: type
        label: Style
        type: select
        options:
          values: [primary, secondary]

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
      - name: alt
        label: Accessibility text
        type: string
      - name: width
        label: Width (pixels)
        type: number
        description: Leave blank to size automatically.
      - name: height
        label: Height (pixels)
        type: number
        description: Leave blank to size automatically.

  section:
    type: object
    label: Section
    fields:
      - name: type
        label: Section type
        type: select
        options:
          values: [hero, default]
      - name: layout
        label: Layout
        type: select
        description: Flex places blocks in a row and adjusts spacing automatically. Grid creates equal columns using the Columns setting.
        options:
          values: [flex, grid]
      - name: cols
        label: Columns
        type: select
        options:
          values: [1, 2, 3, 4, 5]
      - name: blocks
        label: Content blocks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Block {index}"
        fields:
          - name: text
            label: Text
            type: rich-text
          - name: image
            component: image
          - name: button
            component: button

  nav-link:
    type: object
    label: Navigation link
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: href
        label: Link
        type: string
        description: Leave empty for plain text (e.g. contact info).

content:
  - name: site-settings
    label: Site Settings
    type: group
    items:
      - name: header
        label: Header
        type: file
        path: src/data/header.json
        format: json
        fields:
          - name: brand
            label: Brand
            type: object
            fields:
              - name: name
                label: Site name
                type: string
                required: true
              - name: logo
                label: Logo
                type: image
                required: true
              - name: logoAlt
                label: Logo accessibility text
                type: string
                required: true
              - name: tagline
                label: Tagline
                type: text
          - name: navigation
            label: Navigation
            type: object
            fields:
              - name: navLinks
                label: Navigation links
                component: nav-link
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.label}"
              - name: ctaLinks
                label: Call-to-action links
                component: nav-link
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.label}"
      - name: footer
        label: Footer
        type: file
        path: src/data/footer.json
        format: json
        fields:
          - name: brand
            label: Brand
            type: object
            fields:
              - name: name
                label: Site name
                type: string
                required: true
              - name: logo
                label: Logo
                type: image
                required: true
              - name: logoAlt
                label: Logo accessibility text
                type: string
                required: true
              - name: tagline
                label: Tagline
                type: text
          - name: navigation
            label: Navigation
            type: object
            fields:
              - name: columns
                label: Columns
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.heading}"
                fields:
                  - name: heading
                    label: Heading
                    type: string
                    required: true
                  - name: links
                    label: Items
                    description: Add a link URL to make the item clickable, or leave it empty for plain text.
                    component: nav-link
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{fields.label}"
  - name: pages
    label: Pages
    type: collection
    path: src/pages
    format: yaml-frontmatter
    exclude:
      - index.astro
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title]
    fields:
      - name: layout
        label: Layout
        type: string
        default: ../layouts/ContentLayout.astro
        hidden: true
        readonly: true
      - name: title
        label: Page title
        type: string
        required: true
      - name: sections
        label: Page sections
        component: section
        list:
          collapsible:
            collapsed: true
            summary: "{fields.type}"

actions:
  - name: preview-site
    label: Preview current edits
    workflow: pages-cms-preview.yml
    ref: current
    cancelable: true
    confirm:
      title: Update preview site?
      message: This will update the preview deployment from the current editing branch. After it finishes, visit https://preview.hstonline.pages.dev
      button: Preview
  - name: deploy-site
    label: Publish preview to production
    workflow: pages-cms-deploy.yml
    ref: current
    cancelable: true
    confirm:
      title: Deploy to production?
      message: This will validate the preview branch and merge it into main. After it finishes, visit https://hstonline.pages.dev
      button: Deploy

settings:
  content:
    merge: true
