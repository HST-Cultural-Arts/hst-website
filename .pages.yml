media:
  - name: uploads
    label: Page uploads
    input: public/assets/uploads
    output: /assets/uploads
    categories: [image]
  - name: brand
    label: Brand assets
    input: public/assets/brand
    output: /assets/brand
    categories: [image]

components:
  button:
    type: object
    label: Button
    fields:
      - name: title
        label: Text
        type: string
      - name: href
        label: Link
        type: string
      - name: type
        label: Style
        type: select
        options:
          values: [primary, secondary]

  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image file
        type: image
      - name: alt
        label: Accessibility text
        type: string
      - name: size
        label: Display size
        type: select
        description: Controls the image's maximum width while keeping it responsive.
        options:
          values: [small, medium, large, full]
      - name: crop
        label: Crop
        type: select
        description: Natural preserves the complete image. Other options crop it to a consistent frame.
        options:
          values: [natural, landscape, square, portrait]

  brand:
    type: object
    label: Brand
    fields:
      - name: name
        label: Name
        type: string
      - name: logo
        label: Logo
        type: image
      - name: logoAlt
        label: Logo accessibility text
        type: string

  section:
    type: object
    label: Section
    fields:
      - name: type
        label: Section type
        type: select
        options:
          values: [hero, default]
      - name: layout
        label: Layout
        type: select
        description: Auto uses a flexible wrapping layout. Column options use an equal-width grid.
        options:
          values: [auto, 1col, 2cols, 3cols, 4cols, 5cols]
      - name: blocks
        label: Content blocks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Block {index}"
        fields:
          - name: text
            label: Text
            type: rich-text
          - name: image
            component: image
          - name: button
            component: button

content:
  - name: pages
    label: Pages
    type: collection
    path: src/pages
    format: yaml-frontmatter
    exclude:
      - index.astro
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title]
    fields:
      - name: layout
        label: Layout
        type: string
        default: ../layouts/ContentLayout.astro
        hidden: true
        readonly: true
      - name: title
        label: Page title
        type: string
        required: true
      - name: sections
        label: Page sections
        component: section
        list:
          collapsible:
            collapsed: true
            summary: "{fields.type}"

  - name: header
    label: Header
    type: file
    path: src/data/header.json
    fields:
      - name: brand
        component: brand
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: navLinks
            label: Navigation links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Link
                type: string
          - name: ctaLinks
            label: Call-to-action links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: href
                label: Link
                type: string

  - name: footer
    label: Footer
    type: file
    path: src/data/footer.json
    fields:
      - name: brand
        component: brand
      - name: tagline
        label: Tagline
        type: text
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: columns
            label: Footer columns
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.heading}"
            fields:
              - name: heading
                label: Heading
                type: string
              - name: links
                label: Links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.label}"
                fields:
                  - name: label
                    label: Label
                    type: string
                  - name: href
                    label: Link
                    type: string

settings:
  content:
    merge: true
