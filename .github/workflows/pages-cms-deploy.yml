name: Deploy CMS changes

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pagescms-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out editing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Create or update production pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SOURCE_BRANCH" \
              --title "Deploy CMS changes" \
              --body "Automated deployment request from the PagesCMS editing branch.")"
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch=false
